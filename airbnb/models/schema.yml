models:
  - name: dim_listings_cleansed
    tests:
      - minimum_row_count:
          arguments:
            min_row_count: 100
          severity:
            warning

    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

      - name: host_id
        tests:
          - not_null
          - relationships: # placed on child entity to ensure that every child entity (in this case listings) has a parent entity (in this case host).
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        tests:
          - positive_values

  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: is_superhost
        data_type: string
      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp