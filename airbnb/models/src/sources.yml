sources:
  - name: airbnb # source namespace
    database: AIRBNB 
    schema: RAW
    tables:
      - name: listings
        identifier: raw_listings
      - name: hosts
        identifier: raw_hosts
      - name: reviews
        identifier: raw_reviews
        config:
          loaded_at_field: date # field to use for alerts
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
